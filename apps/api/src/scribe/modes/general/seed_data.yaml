# Seed data loaded by scripts/setup.py — Vaarta template directory (wid=DEFAULT).
# Each `desc` is the per-run USER prompt: section skeleton + template-specific
# guidance only. Shared guardrails (no fabrication, omit empty sections, English
# output, third person, no repetition, section-kind semantics) live in the
# SYSTEM prompt — do not duplicate them here.
# Section notation: Name — kind (list | table | key_value | narrative) — guidance.
# `section_ids` stays empty (markdown/desc-based templates).
# Order = directory order: the everyday default first, then formal GoI
# archetypes, lightweight last.
#
# seed_mode controls what re-running setup does to previously seeded rows:
#   append  (default) — upsert everything in this file; rows seeded earlier but
#           no longer listed here are left untouched (still in the directory).
#   replace — additionally soft-archive any wid=DEFAULT row whose id is absent
#           from this file. No hard delete: old sessions/documents keep
#           resolving archived templates; they just disappear from the
#           directory and from users' saved selections.
seed_mode: replace

sections: []
templates:

- id: 9fd477a1-ea35-4fa6-be51-46006808b09d
  title: Meeting Notes
  type: default
  desc: |-
    Structure the recording as clean, skimmable meeting notes someone can scan in under a minute — works for any transcript, formal meeting or casual conversation. Extract whatever signal exists; a low-content transcript still gets a short TL;DR plus whatever else is present. Strip filler, tangents, small talk, and restated points. Preserve names, numbers, dates, and specifics exactly (e.g. ₹30 lakh, 20%).
    SECTIONS — in order (TL;DR is ALWAYS emitted, even for thin transcripts):
    TL;DR — narrative — one or two sentences: the point of the conversation
    Key Topics — list — grouped by theme, not chronology; each topic a bold label followed by 1–3 tight bullets
    Decisions — list — each decision plain and standalone
    Action Items — list — checkbox form: "[ ] Task — Owner (due date)"; if no owner or date is stated, keep the task and mark the gap (e.g. "— owner TBD"); never invent owners or dates
    Open Questions — list — anything unresolved or explicitly flagged for follow-up
  section_ids: []

- id: 912c2577-1259-44b0-85ba-0c54de7a7891
  title: Karyavritt · Official Meeting Minutes
  type: default
  desc: |-
    Structure the recording as formal Government of India meeting minutes. Use official register ("The Chair observed…", "It was decided that…"); refer to participants by name and designation.
    SECTIONS — in order:
    Meeting Details — key_value — Subject, Date & Time, Venue/Mode, Chaired by
    Participants — list — name & designation; note absentees/leave if stated
    Opening Remarks — narrative — remarks of the Chair or convenor
    Action Taken on Previous Meeting — table — columns: Previous Decision, Status, Remarks
    Agenda-wise Discussion & Decisions — narrative — one block per agenda item: brief discussion, then the decision as recorded
    Action Points — table — columns: Action Point, Responsibility, Timeline
    Announcements — list
    Date of Next Meeting — key_value
    The meeting ended with a vote of thanks only if actually stated.
  section_ids: []

- id: 4d3005ed-a172-4339-8058-85ebb9e043a1
  title: Pragati Samiksha · Scheme & Programme Review
  type: default
  desc: |-
    Structure the recording as minutes of a review meeting on scheme/programme implementation (e.g. flagship schemes, district reviews, VC reviews). Formal register; attribute directions to the reviewing authority.
    SECTIONS — in order:
    Meeting Details — key_value — Review of, Date, Venue/Mode, Reviewed by
    Participants — list — name & designation / district / agency
    Progress Reported — table — columns: Item/Indicator, Target, Achievement, Remarks
    Issues & Bottlenecks — list — reported constraints (funds, staff, land, approvals, litigation)
    Directions Issued — list — each direction as stated, with the authority issuing it
    Action Points — table — columns: Action, Responsibility, Timeline
    Matters for Escalation — list — issues to be taken up at a higher level
    Next Review — key_value — date/periodicity if stated
  section_ids: []

