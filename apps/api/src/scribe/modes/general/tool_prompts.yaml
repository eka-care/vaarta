# Prompt content for the AG-UI emit tools, rendered into the system prompt's
# {{tools_available}} block by ToolCatalog.render_tools_available (catalog.py).
#
# Per-tool entries:
#   summary            one-line statement of what the tool emits
#   when_to_use        content shapes this tool is the right choice for
#   rules              hard constraints (columns, streaming order)
#   mandatory_content  content types that MUST use this tool when it is enabled;
#                      rendered into the "Mandatory tool selection" section
#   routes_away        cross-references to sibling tools; each line is rendered
#                      ONLY when the target tool is also enabled for the run
#
# Keys under `tools:` must exactly match NAME_TO_TOOL in generic.py — enforced
# by a unit test (tests/unit/services/templates/ag_ui/tools/test_catalog.py).

version: 1

preamble: |
  Each template section with supporting data is exactly ONE tool call. Emit the
  call's arguments in this exact order so the UI can render the heading before
  its content:
    1. key           Slug of display_name (^[a-z][a-z0-9_]*$); stable across
                     runs of the same template.
    2. display_name  Heading verbatim from the user's template (translated
                     to English).
    3. order         0-indexed; preserve the template's section order.
    4. payload       Kind-specific content.
  Re-emitting with the same `key` REPLACES the section in place — use only to
  revise, never to append. For tabular tools, emit `headers` (the full column
  list) BEFORE `rows`; rows are dicts keyed by header.key; leave a cell blank
  ('') when the transcript does not specify that field. For list/key-value
  tools, emit items top-to-bottom in natural reading order. If one heading
  mixes shapes (e.g. a decisions table plus discussion prose), split it into
  adjacent sections with consecutive `order` values.

fallback_rule: |
  Use ONLY the tools listed below — never reference or attempt any other tool.
  If a content type's dedicated tool is not listed, emit that content with the
  closest listed structural tool; when no structured tool fits, use
  add_narrative as prose. Never drop content because its dedicated tool is
  unavailable.

tools:
  add_list:
    summary: "Emit a bulleted-list section."
    when_to_use: |
      Flat enumerations where order matters but per-item column structure does
      not — action items, decisions, agenda points, follow-ups, requirements,
      questions raised, key takeaways. Each item is one self-contained
      markdown string; inline richer per-item detail (owner, deadline,
      status) in the string itself.
    routes_away:
      - content: "repeated records sharing the same columns"
        tool: add_table
      - content: "labelled single fields"
        tool: add_key_value
      - content: "paragraph-shaped content"
        tool: add_narrative

  add_table:
    summary: "Emit a tabular section (rows x named columns)."
    when_to_use: |
      Records sharing the same named columns — action items with owner and
      due date, issues with status and priority, budget lines, candidate
      scores, task assignments, comparisons.
    rules: |
      Define `headers` once — each with key, label, and editor type
      (text | markdown | number | date) — then `rows` as dicts keyed by
      header.key. STREAM headers BEFORE rows so the UI can build the table
      skeleton before cells arrive. If a section has only one row and no
      natural repetition, prefer a key-value shape.
    routes_away:
      - content: "one-off labelled fields"
        tool: add_key_value
      - content: "a flat list of strings"
        tool: add_list
      - content: "prose"
        tool: add_narrative

  add_key_value:
    summary: "Emit a key-value (definition-list) section of labelled scalar fields."
    when_to_use: |
      Content that reads as labelled scalar fields top-to-bottom — meeting
      metadata (date, attendees, facilitator), session details, contact
      fields, one-line attributes. Each item is a {key, value} pair where
      value is markdown; each label should appear at most once.
    routes_away:
      - content: "the same set of fields repeating for multiple records"
        tool: add_table
      - content: "an ordered enumeration without labels"
        tool: add_list
      - content: "prose"
        tool: add_narrative

  add_narrative:
    summary: "Emit a free-form markdown prose section."
    when_to_use: |
      Content that is naturally prose — discussion summaries, context and
      background, analysis, proposals, open questions narrative, synopsis,
      detailed notes.
    rules: |
      One coherent markdown block; use inline bullets only when the prose
      genuinely calls for them. Do NOT repeat the section heading inside the
      markdown — `display_name` is rendered as the title.
    routes_away:
      - content: "flat enumerations"
        tool: add_list
      - content: "records sharing columns"
        tool: add_table
      - content: "labelled scalar fields"
        tool: add_key_value

mandatory_selection_header: |
  Mandatory tool selection (absolute — apply before everything else): decide
  these by CONTENT, not by section shape, heading wording, or how the
  template formats or describes them. A section whose content matches one of
  these types MUST use its mapped tool — even if the template names or formats
  it as a list/table, even if its description says to list or tabulate it, and
  even if it contains only a single item:
