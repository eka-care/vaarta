# Scribe — LOCAL stack (locked to the working local setup).
#   postgres + api (which also serves the web UI at :8000); worker via
#   --profile worker. No Redis, no AWS. The web bundle is a static export with
#   relative URLs — no host baked in, no separate web container.
#   Usage: docker compose -f deploy/docker-compose-local.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    # loopback-only so the DB is never exposed off-box; native `make api/setup`
    # connect via 127.0.0.1 (use 127.0.0.1 in DATABASE_URL — on macOS
    # "localhost" resolves to ::1 first, which this binding does not serve).
    # Host port 5433 to coexist with a natively installed Postgres on 5432;
    # containers still reach it as postgres:5432 on the compose network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      ECHO_PG_HOST: postgres
      ECHO_PG_PORT: 5432
      # override .env's relative ./storage so api + worker share the mounted volume
      STORAGE_ROOT: /data/storage
    volumes:
      - storage:/data/storage
      - logs:/data/logs
      - ./certs:/certs:ro   # drop private CA pem files here (OPENWEBUI_CA_BUNDLE=/certs/<file>.pem)
    ports:
      - "8000:8000"   # fronted by infra SSL on the VM (https://bharat-backend.dev.eka.care)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    # Only for EXECUTION_MODE=worker: docker compose --profile worker up
    # (and set EXECUTION_MODE=worker + UVICORN_WORKERS>1 on api). Default mode
    # (inprocess) runs the pipeline inside the api container, so this stays off.
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      ECHO_PG_HOST: postgres
      ECHO_PG_PORT: 5432
      STORAGE_ROOT: /data/storage
      # PATCH callbacks go to the api service, not the worker's own localhost
      SELF_URL: http://api:8000
    volumes:
      - storage:/data/storage
      - logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy

  # --- local S3, opt-in -------------------------------------------------------
  # docker compose -f deploy/docker-compose-local.yml --profile s3 up -d
  # Console: http://localhost:9001 (minioadmin / minioadmin). Dev only.
  # The api reaches it as http://minio:9000 on the compose network, so set
  # S3_ENDPOINT_URL=http://minio:9000 in .env (NOT localhost — that is the
  # container's own loopback).
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the two buckets the app expects, then exit. Bucket names
  # come from the root .env so they cannot drift from what the routers read.
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    env_file: ../.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/$${S3_VADED_BUCKET_NAME:-voice-records} &&
      mc mb -p local/$${S3_NON_VADED_BUCKET_NAME:-voice-records-batch} &&
      mc ls local &&
      echo 'buckets ready'"

  # --- mock identity provider, opt-in -----------------------------------------
  # docker compose -f deploy/docker-compose-local.yml --profile mockidp up -d mockidp
  #
  # Lets the whole login flow be tested without an account at the real provider.
  # Deliberately strict: it rejects a form-encoded token body and a
  # "Bearer "-prefixed userinfo header, so a regression away from the real
  # provider's quirks fails here instead of passing quietly.
  #
  # Two different URLs are needed for one provider entry, because the hops
  # have different callers:
  #   authorization_endpoint -> the BROWSER follows it  -> http://localhost:9500
  #   token/userinfo         -> the API container calls -> http://mockidp:9500
  mockidp:
    image: python:3.11-slim
    profiles: ["mockidp"]
    restart: unless-stopped
    command: ["python", "/mock/mock_oauth_provider.py", "--port", "9500"]
    volumes:
      - ../scripts/mock_oauth_provider.py:/mock/mock_oauth_provider.py:ro
    ports:
      - "127.0.0.1:9500:9500"

volumes:
  pgdata:
  storage:
  logs:
  miniodata:
