apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekascribe-api
  namespace: eka-care
  labels:
    app.kubernetes.io/name: ekascribe-api
    app.kubernetes.io/part-of: ekascribe
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ekascribe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ekascribe-api
        app.kubernetes.io/part-of: ekascribe
    spec:
      hostAliases:
        - ip: "10.185.27.69"
          hostnames:
            - "vaarta-model.bharatai.gov.in"    
        - ip: "10.185.27.77"
          hostnames:
            - "bharatai.gov.in"
        - ip: "100.78.1.101"
          hostnames:
            - "cdacchndstvals3arc.ipstorage.tatacommunications.com"
        # - ip: "100.78.69.4"
        #   hostnames:
        #     - "vaarta.bharatai.gov.in"                     
      imagePullSecrets:
        - name: ekascribe-regcred
      
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      # - chncdocopwapp01w3-rvz6t-qwqvs   # re-enable when Calico is fixed
                      - chncdocopwapp01w3-rvz6t-z2qff

      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h ekascribe-postgres -p 5432 -U scribe -d scribe; do
                echo "waiting for postgres..."
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        # Container name is `api` -- deploy/push.sh prints
        # `kubectl set image deploy/ekascribe-api api=...` to pin a tag.
        - name: api
          image: ekacare/ekascribe:api-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ekascribe-config
            - secretRef:
                name: ekascribe-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # STORAGE_BACKEND=local: /data/storage is the recording store and
          # rides the PVC (07-api-storage-pvc.yaml); logs stay ephemeral.
          volumeMounts:
            - name: storage
              mountPath: /data/storage
            - name: logs
              mountPath: /data/logs

          resources:
            requests:
              cpu: 3500m
              memory: 6656Mi
            limits:
              cpu: 3500m
              memory: 6656Mi
      volumes:
        - name: storage
          #persistentVolumeClaim:
          #  claimName: ekascribe-api-storage
          emptyDir: {}
        - name: logs
          emptyDir: {}
