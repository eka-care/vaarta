apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: varta-gw
  namespace: eka-care
spec:
  selector:
    istio: ingressgateway
  servers:
  # Port 80 serves plain HTTP. Flip httpsRedirect to true to force 301 -> https.
  - hosts:
    - vaarta.bharatai.gov.in
    port:
      name: http
      number: 80
      protocol: HTTP
    tls:
      httpsRedirect: true
  - hosts:
    - vaarta.bharatai.gov.in
    port:
      name: https
      number: 443
      protocol: HTTPS
    tls:
      mode: SIMPLE
      # TCL-owned secret in the istio-ingress namespace (eMudhra wildcard
      # *.bharatai.gov.in, expires 2026-11-10). Gateway SDS resolves
      # credentialName in the gateway pods' namespace, so tenant-namespace
      # secrets are invisible here — renewals/changes go through TCL.
      credentialName: vaarta-server-tls
---
# 4. Route to the app.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: varta-vs
  namespace: eka-care
spec:
  gateways:
  - varta-gw
  hosts:
  - varta.bharatai.gov.in
  - vaarta.bharatai.gov.in

  http:
  # /artifacts/* is the desktop-app release service (eka-artifact-serving).
  # It must stay ABOVE the catch-all: Istio evaluates these in order and the
  # last rule matches everything.
  #
  # timeout 0s because a 200MB installer over a clinic uplink would otherwise
  # run into whatever request timeout this Istio version defaults to.
  - name: artifacts
    match:
    - uri:
        prefix: /artifacts/
    - uri:
        exact: /artifacts
    timeout: 0s
    route:
    - destination:
        host: eka-artifact-serving.eka-care.svc.cluster.local
        port:
          number: 8080
  # Catch-all: the api, which also serves the web UI.
  - name: api
    route:
    - destination:
        host: ekascribe-api.eka-care.svc.cluster.local
        port:
          number: 8000
