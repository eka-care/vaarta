apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: {{ required "nodeRole is required" .Values.nodeRole | quote }}
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.diskSize }}
        volumeType: gp3
        encrypted: true          # the account may not encrypt EBS by default
        deleteOnTermination: true
  tags:
    karpenter.sh/discovery: {{ .Values.clusterName | quote }}
