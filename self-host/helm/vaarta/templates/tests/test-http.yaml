{{- if include "vaarta.testOn" (list . "http") }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "vaarta.fullname" . }}-test-http
  labels:
    {{- include "vaarta.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: http
      image: {{ include "vaarta.testImage" (list . "curl" "curlimages/curl:8.10.1") }}
      command: ["sh", "-c"]
      args:
        - |
          url="http://{{ include "vaarta.fullname" . }}:{{ .Values.service.port }}/healthz"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
            if [ "$code" = "200" ]; then echo "PASS http: $url returned 200"; exit 0; fi
            echo "attempt $i/30: $url returned ${code:-no response}"
            sleep 2
          done
          echo "FAIL http: $url never returned 200. Check: kubectl logs deploy/{{ include "vaarta.fullname" . }}"
          exit 1
{{- end }}
