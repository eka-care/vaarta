{{- if (.Values.serviceAccount).create }}   {{/* parenthesised: survives `helm upgrade --reuse-values` from a chart version without this key */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vaarta.serviceAccountName" . }}
  labels: {{- include "vaarta.labels" . | nindent 4 }}
  {{- with (.Values.serviceAccount).annotations }}
  annotations: {{- toYaml . | nindent 4 }}   # IRSA: eks.amazonaws.com/role-arn
  {{- end }}
{{- end }}
