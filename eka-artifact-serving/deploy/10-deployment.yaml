# eka-artifact-serving: the public byte-serving tier.
#
# A separate Deployment from ekascribe-api -- its own image, its own lifecycle,
# its own resource envelope -- but co-located on the api's nodes (see the
# affinity block below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eka-artifact-serving
  namespace: eka-care
  labels:
    app.kubernetes.io/name: eka-artifact-serving
    app.kubernetes.io/part-of: ekascribe
spec:
  # 1, not 2, while chncdocopwapp01w3-rvz6t-qwqvs is excluded below: only one
  # node is schedulable, so a second replica adds no availability. Restore to 2
  # together with qwqvs.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eka-artifact-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eka-artifact-serving
        app.kubernetes.io/part-of: ekascribe
    spec:
      hostAliases:
        - ip: "100.78.1.101"
          hostnames:
            - "cdacchndstvals3arc.ipstorage.tatacommunications.com"
        # The LiteLLM front end behind /artifacts/models/. Cluster DNS does not
        # resolve it either -- deploy/k8s/10-api-deployment.yaml carries the
        # same entry for the same reason. Without it the proxy answers 502 on
        # every request; with it, nothing else about the model path is needed,
        # because MODEL_API_BASE_URL already arrives from ekascribe-config.
        - ip: "10.185.27.69"
          hostnames:
            - "vaarta-model.bharatai.gov.in"
      imagePullSecrets:
        - name: ekascribe-regcred
      # !! TEMPORARY - chncdocopwapp01w3-rvz6t-qwqvs is REMOVED, not retired !!
      #
      # Pod networking between qwqvs and chncdocopwapp01w1-mnqj7-qg65z is broken
      # in both directions (verified 2026-09-03). The istio ingress gateway runs
      # on qg65z, so a pod on qwqvs sits in the Service endpoints while being
      # unreachable from the gateway - surfacing as intermittent "upstream
      # connect error ... connection timeout" on roughly half of requests
      # through varta-vs, rather than a clean failure.
      #
      # Workaround for a Calico fault on that node pair, not a placement
      # decision. deploy/k8s/10-api-deployment.yaml carries the identical change
      # for the same reason - restore both together when routing is fixed.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      # - chncdocopwapp01w3-rvz6t-qwqvs   # re-enable when Calico is fixed
                      - chncdocopwapp01w3-rvz6t-z2qff
      containers:
        - name: eka-artifact-serving
          image: ekacare/eka-artifact-serving:v0.1.2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ARTIFACTS_PREFIX
              value: "artifacts"
            # botocore >=1.36 sends every multipart UploadPart as aws-chunked
            # with a CRC32 trailer. This store rejects that trailer outright --
            # "InvalidRequest: Missing checksum in trailer data" -- which is how
            # the Vaarta 1.0.8 .dmg push 500'd. apps/api never hit it because it
            # only ever calls put_object; UploadPart is a different code path.
            # when_required keeps checksums for the operations that mandate them
            # and drops them everywhere else, which is what this store expects.
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: "when_required"
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: "when_required"
            # s3transfer runs 10 upload threads by default, and glibc hands each
            # one its own malloc arena -- up to 8 x ncores of them, 64MB each on
            # these 8-core nodes. Freed part buffers go back to the arena but the
            # arena never goes back to the OS, so the heap ratchets: a pod that
            # has served one release sits at ~340Mi anon while idle, against a
            # baseline of ~155Mi. Two arenas caps that ratchet.
            - name: MALLOC_ARENA_MAX
              value: "2"
          envFrom:
            # S3_ENDPOINT_URL, S3_BUCKET, AWS_REGION, LOG_LEVEL
            - configMapRef:
                name: ekascribe-config
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (boto3 default chain)
            - secretRef:
                name: ekascribe-secrets
            # ARTIFACTS_KEY (+ ARTIFACTS_KEY_NEXT during a rotation),
            # MODEL_PROXY_KEY (+ _NEXT) for /artifacts/models/
            - secretRef:
                name: eka-artifact-serving-secrets
          readinessProbe:
            # /readyz fails when the bucket or write key is missing, so a
            # mis-mounted Secret never takes traffic.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            # /healthz never touches the store: a store blip should surface as
            # 5xx on the affected routes, not restart-loop the whole tier.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            # 512Mi was too tight for a tier whose job is 300MB installers: the
            # 1.0.8 push OOMKilled a pod (exit 137) with ~340Mi of ratcheted heap
            # plus ~100Mi of in-flight multipart buffers. Each w3 node has 14.05Gi
            # allocatable against 6.75Gi of visible requests, so the extra 256Mi
            # of request per replica is comfortably affordable.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            # Uploads spool here before going to the store. Sized for a couple
            # of concurrent pushes; downloads never touch disk.
            - name: spool
              mountPath: /tmp
      volumes:
        - name: spool
          emptyDir:
            sizeLimit: 4Gi
