[project]
name = "eka-artifact-serving"
version = "0.1.0"
description = "Serves Vaarta desktop releases from the client's internal object store."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # Same major as apps/api, so the boto3 behaviour proven against this store
    # (SigV4, default addressing, default request checksums) is the behaviour
    # we get here too.
    "boto3>=1.38",
    "PyYAML>=6.0",
    # The model proxy streams both directions; httpx is the only client in the
    # stack that can stream a request body and an SSE response at once.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eka_artifact_serving"]
